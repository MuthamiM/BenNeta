# Apache Reverse Proxy Configuration for BenNeta at mftechnologies.org
# Connects incoming public traffic to Docker container on 127.0.0.1:8765

<VirtualHost *:80>
    ServerName mftechnologies.org
    ServerAlias www.mftechnologies.org benneta.mftechnologies.org

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"

    # Forward all traffic to the BenNeta Docker container
    ProxyPass / http://127.0.0.1:8765/
    ProxyPassReverse / http://127.0.0.1:8765/

    # Real IP and headers
    ProxyAddHeaders On

    ErrorLog ${APACHE_LOG_DIR}/benneta_error.log
    CustomLog ${APACHE_LOG_DIR}/benneta_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName mftechnologies.org
    ServerAlias www.mftechnologies.org benneta.mftechnologies.org

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Forward all traffic to the BenNeta Docker container
    ProxyPass / http://127.0.0.1:8765/
    ProxyPassReverse / http://127.0.0.1:8765/

    ProxyAddHeaders On

    ErrorLog ${APACHE_LOG_DIR}/benneta_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/benneta_ssl_access.log combined
</VirtualHost>
