# Apache Reverse Proxy Configuration for BenNeta SUBDOMAIN ONLY
# Isolated to: benneta.mftechnologies.org
# Company root website (mftechnologies.org), icaps, karibu, nexora, etc. are 100% UNTOUCHED

<VirtualHost *:80>
    ServerName benneta.mftechnologies.org
    ServerAlias www.benneta.mftechnologies.org

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"

    # Forward strictly to the isolated BenNeta Docker container
    ProxyPass / http://127.0.0.1:8765/
    ProxyPassReverse / http://127.0.0.1:8765/

    ProxyAddHeaders On

    ErrorLog ${APACHE_LOG_DIR}/benneta_error.log
    CustomLog ${APACHE_LOG_DIR}/benneta_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName benneta.mftechnologies.org
    ServerAlias www.benneta.mftechnologies.org

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Forward strictly to the isolated BenNeta Docker container
    ProxyPass / http://127.0.0.1:8765/
    ProxyPassReverse / http://127.0.0.1:8765/

    ProxyAddHeaders On

    ErrorLog ${APACHE_LOG_DIR}/benneta_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/benneta_ssl_access.log combined
</VirtualHost>
