# Nginx Production Config for BenNeta at mftechnologies.org
# Reverse proxies to the BenNeta Docker container on port 8765

upstream benneta_app {
    server 127.0.0.1:8765;
    keepalive 8;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name mftechnologies.org www.mftechnologies.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://$host$request_uri;
}

# HTTPS — serves mftechnologies.org
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mftechnologies.org www.mftechnologies.org;

    # Certbot will auto-fill these after running
    # ssl_certificate /etc/letsencrypt/live/mftechnologies.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mftechnologies.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 16M;

    # All traffic -> Docker container
    location / {
        proxy_pass http://benneta_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }

    # Binary downloads — force download header
    location /downloads/ {
        proxy_pass http://benneta_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Content-Disposition "attachment" always;
    }

    # Block sensitive paths
    location ~ /\. { deny all; }
    location ^~ /config/ { deny all; }
    location ^~ /data/ { deny all; }
    location ^~ /php/ { deny all; }
    location ^~ /python/ { deny all; }
}
