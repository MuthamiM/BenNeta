# Nginx Reverse Proxy Configuration for BenNeta at mftechnologies.org
# Place in /etc/nginx/sites-available/benneta-mftechnologies.conf
# Enable with: ln -s /etc/nginx/sites-available/benneta-mftechnologies.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name benneta.mftechnologies.org api.mftechnologies.org;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name benneta.mftechnologies.org api.mftechnologies.org;

    # SSL Certificates (managed via Certbot Let's Encrypt or Cloudflare Origin CA)
    # ssl_certificate /etc/letsencrypt/live/benneta.mftechnologies.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/benneta.mftechnologies.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /opt/benneta/web;
    index index.html index.php;

    client_max_body_size 16M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to local PHP-FPM or local PHP server
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ^~ /config/ {
        deny all;
    }

    location ^~ /data/ {
        deny all;
    }
}
