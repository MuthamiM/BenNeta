<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" width="340" height="72">
  <defs>
    <linearGradient id="logoTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e08264" />
      <stop offset="50%" stop-color="#d97757" />
      <stop offset="100%" stop-color="#c46344" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#d97757" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Starburst Mark Icon -->
  <g transform="translate(4, 4)">
    <rect width="64" height="64" rx="16" fill="#14171f" stroke="#262b38" stroke-width="1.5" />
    <g transform="translate(32, 32)" filter="url(#logoGlow)">
      <line x1="0" y1="-19" x2="0" y2="19" stroke="url(#logoTerracotta)" stroke-width="5.5" stroke-linecap="round"/>
      <line x1="-19" y1="0" x2="19" y2="0" stroke="url(#logoTerracotta)" stroke-width="5.5" stroke-linecap="round"/>
      <line x1="-13.5" y1="-13.5" x2="13.5" y2="13.5" stroke="url(#logoTerracotta)" stroke-width="5.5" stroke-linecap="round"/>
      <line x1="-13.5" y1="13.5" x2="13.5" y2="-13.5" stroke="url(#logoTerracotta)" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" opacity="0.95" />
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="82" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', 'Inter', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5" fill="#f0f2f5">
    Ben<tspan fill="#d97757">Neta</tspan>
  </text>
  
  <text x="83" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.8" fill="#8a94a6">
    INTELLIGENCE &amp; AUTOMATION
  </text>

  <!-- Version Pill -->
  <g transform="translate(230, 20)">
    <rect width="52" height="20" rx="10" fill="#1c202d" stroke="#2e3547" stroke-width="1" />
    <text x="26" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="600" fill="#d97757" text-anchor="middle">v1.0.0</text>
  </g>
</svg>
