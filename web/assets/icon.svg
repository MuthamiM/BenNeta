<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e08264" />
      <stop offset="50%" stop-color="#d97757" />
      <stop offset="100%" stop-color="#c46344" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#d97757" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Rounded Squircle Base -->
  <rect width="128" height="128" rx="30" fill="#14171f" stroke="#262b38" stroke-width="2" />
  <!-- Inner Subtle Accent -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="none" stroke="#d97757" stroke-width="1" stroke-opacity="0.2" />
  
  <!-- Claude-style Terracotta Starburst / Spark Motif -->
  <g transform="translate(64, 64)" filter="url(#subtleGlow)">
    <!-- Cardinal Spikes -->
    <line x1="0" y1="-38" x2="0" y2="38" stroke="url(#terracottaGrad)" stroke-width="11" stroke-linecap="round"/>
    <line x1="-38" y1="0" x2="38" y2="0" stroke="url(#terracottaGrad)" stroke-width="11" stroke-linecap="round"/>
    <!-- Diagonal Spikes -->
    <line x1="-27" y1="-27" x2="27" y2="27" stroke="url(#terracottaGrad)" stroke-width="11" stroke-linecap="round"/>
    <line x1="-27" y1="27" x2="27" y2="-27" stroke="url(#terracottaGrad)" stroke-width="11" stroke-linecap="round"/>
    <!-- Center Core Glow -->
    <circle cx="0" cy="0" r="7" fill="#fff" opacity="0.9" />
  </g>
</svg>
